{# Upper-right: live incoming emergency reports from public.emergency_incidents (filled by dispatch.js). #}
<section id="incident-panel" class="bg-brand-card rounded-lg border border-brand-border p-3.5 flex flex-col shadow-tacticalCyan flex-1 min-h-[15rem] max-h-[60vh] lg:max-h-none lg:h-0 lg:min-h-[20rem]" aria-labelledby="incident-panel-title">
  <div class="flex items-center justify-between gap-2 mb-2.5 shrink-0">
    <h2 id="incident-panel-title" class="flex items-center gap-2 text-xs font-bold tracking-wider uppercase text-white">
      <span class="relative flex h-2.5 w-2.5">
        <span data-new-ping class="hidden animate-ping absolute inline-flex h-full w-full rounded-full bg-red-500 opacity-75"></span>
        <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-red-500"></span>
      </span>
      Incoming Emergency Reports
    </h2>
    <div class="flex items-center gap-2">
      <span id="dispatch-live" class="flex items-center gap-1.5 text-[0.625rem] font-mono text-slate-400" title="Live connection">
        <span class="w-1.5 h-1.5 rounded-full bg-slate-500"></span><span>CONNECTING</span>
      </span>
      <button type="button" id="incident-refresh" class="p-1 rounded text-slate-400 hover:text-brand-cyan hover:bg-brand-cyan/10" title="Refresh now" aria-label="Refresh incidents">
        <span class="material-symbols-outlined text-[1.125rem]" aria-hidden="true">refresh</span>
      </button>
    </div>
  </div>

  <div class="flex gap-1 mb-2.5 shrink-0 text-[0.625rem] font-mono" role="tablist" aria-label="Filter incidents">
    {% for key, text in [('open', 'OPEN'), ('new', 'NEW'), ('closed', 'CLOSED'), ('all', 'ALL')] %}
    <button type="button" role="tab" data-incident-filter="{{ key }}" aria-selected="{{ 'true' if loop.first else 'false' }}"
            class="px-2 py-1 rounded border border-brand-borderSubtle text-slate-400 hover:text-slate-200 aria-selected:text-brand-cyan aria-selected:border-brand-cyan/60 aria-selected:bg-brand-cyan/10">
      {{ text }} <span data-filter-count="{{ key }}"></span>
    </button>
    {% endfor %}
  </div>

  <div id="incident-list" class="flex-1 overflow-y-auto -mr-1.5 pr-1.5 flex flex-col gap-2" aria-live="polite" aria-busy="true">
    {% for _ in range(3) %}<div class="h-16 shrink-0 rounded-md bg-[#141a2b] border border-brand-borderSubtle animate-pulse"></div>{% endfor %}
  </div>
</section>
