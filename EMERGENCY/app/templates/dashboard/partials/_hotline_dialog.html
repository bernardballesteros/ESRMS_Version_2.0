{% set input = "w-full px-3 py-2 rounded-md bg-[#0a1020] border border-brand-borderSubtle text-sm text-white placeholder-slate-500 focus:outline-none focus:border-brand-cyan focus:ring-1 focus:ring-brand-cyan/40" %}
{% set label = "block text-xs font-semibold text-slate-300 mb-1" %}
<dialog id="hotline-dialog" class="backdrop:bg-black/70 bg-transparent p-0 w-full max-w-lg text-slate-100">
  <form id="hotline-form" novalidate class="rounded-xl bg-[#0d1424] border border-brand-border shadow-2xl">
    <div class="flex items-center justify-between px-5 py-4 border-b border-brand-borderSubtle">
      <h2 id="hotline-form-title" class="text-base font-bold text-white">Add Hotline</h2>
      <button type="button" data-close class="p-1 rounded hover:bg-white/10" aria-label="Close"><span class="material-symbols-outlined">close</span></button>
    </div>
    <div class="px-5 py-4 grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div id="hotline-form-error" class="sm:col-span-2 hidden p-3 rounded-md bg-red-950/60 border border-red-500/40 text-red-200 text-sm" role="alert"></div>
      <div class="sm:col-span-2">
        <label for="hl-name" class="{{ label }}">Organization name <span class="text-red-400">*</span></label>
        <input id="hl-name" name="organization_name" maxlength="120" required class="{{ input }}">
        <p data-error-for="organization_name" class="hidden text-xs text-red-400 mt-1"></p>
      </div>
      <div>
        <label for="hl-phone" class="{{ label }}">Hotline number <span class="text-red-400">*</span></label>
        <input id="hl-phone" name="phone_number" type="tel" maxlength="25" required class="{{ input }} font-mono" placeholder="+63 82 123 4567">
        <p data-error-for="phone_number" class="hidden text-xs text-red-400 mt-1"></p>
      </div>
      <div>
        <label for="hl-category" class="{{ label }}">Category <span class="text-red-400">*</span></label>
        <select id="hl-category" name="category" required class="{{ input }}">
          <option value="">Select…</option>
          {% for k, v in dispatch_options.hotlineCategories.items() %}<option value="{{ k }}">{{ v }}</option>{% endfor %}
        </select>
        <p data-error-for="category" class="hidden text-xs text-red-400 mt-1"></p>
      </div>
      <div class="sm:col-span-2">
        <label for="hl-hours" class="{{ label }}">Operating hours <span class="font-normal text-slate-500">(optional)</span></label>
        <input id="hl-hours" name="operating_hours" maxlength="80" class="{{ input }}" placeholder="e.g. 24/7">
        <p data-error-for="operating_hours" class="hidden text-xs text-red-400 mt-1"></p>
      </div>
      <div class="sm:col-span-2">
        <label for="hl-desc" class="{{ label }}">Description <span class="font-normal text-slate-500">(optional)</span></label>
        <textarea id="hl-desc" name="description" rows="2" maxlength="500" class="{{ input }}"></textarea>
        <p data-error-for="description" class="hidden text-xs text-red-400 mt-1"></p>
      </div>
    </div>
    <div class="flex justify-end gap-2 px-5 py-4 border-t border-brand-borderSubtle">
      <button type="button" data-close class="px-4 py-2 rounded-md text-sm text-slate-300 hover:bg-white/10">Cancel</button>
      <button type="submit" class="px-4 py-2 rounded-md text-sm font-semibold bg-gradient-to-r from-[#00D9FF] to-[#1685FF] hover:brightness-110 text-[#050A12]">Save Hotline</button>
    </div>
  </form>
</dialog>

<dialog id="dispatch-confirm" class="backdrop:bg-black/70 bg-transparent p-0 w-full max-w-sm text-slate-100">
  <form method="dialog" class="rounded-xl bg-[#0d1424] border border-brand-border shadow-2xl p-5">
    <h2 data-title class="font-bold text-white"></h2>
    <p data-text class="text-sm text-slate-400 mt-1"></p>
    <div class="flex justify-end gap-2 mt-5">
      <button value="cancel" class="px-4 py-2 rounded-md text-sm text-slate-300 hover:bg-white/10">Cancel</button>
      <button value="ok" data-ok class="px-4 py-2 rounded-md text-sm font-semibold bg-red-600 hover:bg-red-500 text-white"></button>
    </div>
  </form>
</dialog>
