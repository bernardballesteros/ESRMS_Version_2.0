{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
<div class="space-y-2 {{ flash_class|default('mb-4') }}">
  {% for category, message in messages %}
  {% if category == 'error' %}
  <div class="p-3 rounded-lg bg-red-950/50 border border-red-500/40 text-red-200 text-xs flex items-start gap-2.5" role="alert">
    <svg class="w-4 h-4 text-red-400 shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
    <div>{{ message }}</div>
  </div>
  {% else %}
  <div class="p-3 rounded-lg bg-cyan-950/60 border border-cyan-500/40 text-cyan-200 text-xs flex items-start gap-2.5" role="status">
    <svg class="w-4 h-4 text-cyan-400 shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
    <div>{{ message }}</div>
  </div>
  {% endif %}
  {% endfor %}
</div>
{% endif %}
{% endwith %}
