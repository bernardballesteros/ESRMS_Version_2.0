{# Form helpers for the registration screens. #}

{% macro input(name, label, icon, placeholder='', type='text', tag='', tag_class='text-primary', form={}, extra_class='', attrs='') %}
<div class="flex flex-col gap-space-xs {{ extra_class }}">
  <label for="{{ name }}" class="font-label-md text-label-md text-on-surface-variant flex items-center justify-between">
    <span>{{ label }}</span>
    {% if tag %}<span class="{{ tag_class }} font-label-sm text-label-sm uppercase">{{ tag }}</span>{% endif %}
  </label>
  <div class="relative flex items-center">
    <span class="absolute left-3 text-outline material-symbols-outlined text-[1.125rem] pointer-events-none">{{ icon }}</span>
    <input id="{{ name }}" name="{{ name }}" type="{{ type }}" placeholder="{{ placeholder }}" required
           {% if type != 'password' %}value="{{ form.get(name, '') }}"{% endif %} {{ attrs|safe }}
           class="w-full pl-10 pr-space-md py-2.5 bg-surface-container-lowest rounded-lg text-on-surface placeholder:text-outline/60 font-body-md text-body-md focus:outline-none focus:ring-1 focus:ring-primary-container transition-all">
  </div>
</div>
{% endmacro %}

{% macro dropzone(name, title, hint, icon='cloud_upload') %}
<label class="relative group cursor-pointer flex-1 bg-surface-container-lowest hover:bg-surface-container rounded-lg p-space-md flex flex-col items-center justify-center text-center transition-all">
  <input type="file" name="{{ name }}" accept=".pdf,.jpg,.jpeg,.png" data-file-label="{{ name }}-label" class="sr-only">
  <div class="w-12 h-12 rounded-full bg-surface-container-high group-hover:bg-primary-container/20 flex items-center justify-center mb-space-sm group-hover:scale-110 transition-all">
    <span class="material-symbols-outlined text-primary text-[1.625rem]">{{ icon }}</span>
  </div>
  <span id="{{ name }}-label" class="font-label-lg text-label-lg text-on-surface">{{ title }}</span>
  <span class="font-body-sm text-body-sm text-outline mt-1 max-w-xs">{{ hint }}</span>
  <span class="mt-space-md inline-flex items-center gap-space-xs px-space-sm py-1 rounded bg-surface-container text-primary font-label-sm text-label-sm">
    <span class="material-symbols-outlined text-[0.875rem]">upload_file</span>BROWSE LOCAL FILES
  </span>
</label>
{% endmacro %}
